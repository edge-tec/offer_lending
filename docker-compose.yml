version: '3.8'

services:
  web:
    build: .
    container_name: fwb_affiliate_app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fwb_affiliate
      DB_USERNAME: fwb_user
      DB_PASSWORD: fwb_secret_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: fwb_affiliate_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: fwb_affiliate
      MYSQL_USER: fwb_user
      MYSQL_PASSWORD: fwb_secret_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_master_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

